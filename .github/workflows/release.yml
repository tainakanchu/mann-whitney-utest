name: Release

# GitHub Release を publish したら npm に公開する。
# 認証は npm trusted publishing (OIDC) を使うため NPM_TOKEN は不要。
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) に必要

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # バージョンは package.json の packageManager を参照

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # trusted publishing には npm CLI 11.5.1 以上が必要
      - run: npm install -g npm@^11.5.1

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version (v$VERSION)"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test

      # trusted publishing 経由の publish では provenance が自動付与される
      - run: npm publish --access public
