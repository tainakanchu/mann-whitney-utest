name: Release

# GitHub Release を publish したら npm に staged publish する。
# 認証は npm trusted publishing (OIDC) を使うため NPM_TOKEN は不要。
# 公開には maintainer による承認 (2FA) が必要:
#   npmjs.com の Staged Packages タブ、または `npm stage approve <stage-id>`
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) に必要

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # バージョンは package.json の packageManager を参照

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # staged publishing には npm CLI 11.15.0 以上が必要
      - run: npm install -g npm@^11.15.0

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version (v$VERSION)"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test

      # trusted publishing 経由では provenance が自動付与される
      - name: Stage publish
        run: |
          set -o pipefail
          npm stage publish --access public 2>&1 | tee stage.log
          STAGE_ID="$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' stage.log | tail -1)"
          {
            echo "### Staged ${GITHUB_REF_NAME}"
            echo
            echo "Approve on npmjs.com (Staged Packages tab) or run:"
            echo
            echo '```sh'
            echo "npm stage approve ${STAGE_ID:-<stage-id>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
